  <text x="26" y="40" fill="#F3EDE1" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" letter-spacing=".3">BITJJK</text>
  <text x="26" y="67" fill="#F3EDE1" fill-opacity="0.92"
      font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5">A text-based Jujutsu Kaisen life sim. Born human, awaken to cursed energy, climb the grades.</text>
  <text x="26" y="90" fill="#8C93A1" fill-opacity="1"
      font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5">Or turn, and become the thing they hunt. Every run ends in an obituary — then the next generation begins.</text>
