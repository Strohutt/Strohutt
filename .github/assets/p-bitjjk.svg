    <text x="168.5" y="124.5" text-anchor="middle" fill="#61DAFB" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">React</text></g><g><rect x="208" y="108" width="79" height="24" rx="12" fill="#E8A33D" fill-opacity=".13" stroke="#E8A33D" stroke-opacity=".45" />
