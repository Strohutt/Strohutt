    <text x="318" y="124.5" text-anchor="middle" fill="#33C9A7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">PWA</text></g><g><rect x="349" y="108" width="79" height="24" rx="12" fill="#8C93A1" fill-opacity=".13" stroke="#8C93A1" stroke-opacity=".45" />
