    <text x="144.5" y="124.5" text-anchor="middle" fill="#8C93A1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">py-cord</text></g><g><rect x="192" y="108" width="71" height="24" rx="12" fill="#6BA5E8" fill-opacity=".13" stroke="#6BA5E8" stroke-opacity=".45" />
    <text x="227.5" y="124.5" text-anchor="middle" fill="#6BA5E8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">SQLite</text></g><g><rect x="271" y="108" width="63" height="24" rx="12" fill="#61DAFB" fill-opacity=".13" stroke="#61DAFB" stroke-opacity=".45" />
    <text x="302.5" y="124.5" text-anchor="middle" fill="#61DAFB" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">React</text></g><g><rect x="342" y="108" width="71" height="24" rx="12" fill="#C77DFF" fill-opacity=".13" stroke="#C77DFF" stroke-opacity=".45" />
